<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Luchas de las Tribus - Tablero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #654321;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* Contador de 15 segundos en los controles */
        .turn-timer-display {
            font-size: clamp(1.5em, 3vw, 2.2em);
            font-weight: bold;
            padding: clamp(6px, 1vh, 12px) clamp(15px, 2vw, 25px);
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffcc00;
            border-radius: 10px;
            min-width: clamp(60px, 8vw, 90px);
            text-align: center;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .turn-timer-display.warning {
            color: #ff0000;
            border-color: #ff0000;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Botón LISTO */
        .ready-button {
            padding: clamp(8px, 1.5vh, 14px) clamp(20px, 3vw, 35px);
            font-size: clamp(1em, 2vw, 1.4em);
            background: #4CAF50;
            color: white;
            border: 3px solid #333;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .ready-button:hover {
            background: #45a049;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
        }

        .ready-button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            background: none;
            border: none;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 1fr) auto;
            padding: clamp(5px, 1vh, 15px);
            gap: clamp(5px, 1vh, 12px);
            position: relative;
            z-index: 1;
        } 

        /* Header con información */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(8px, 1.5vh, 15px) clamp(15px, 2vw, 30px);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            border: 2px solid #ffcc00;
            min-height: clamp(60px, 8vh, 100px);
        }

        .player-info {
            font-size: clamp(1em, 2vw, 1.5em);
            font-weight: bold;
        }

        .center-info {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: clamp(3px, 0.5vh, 8px);
        }

        #timer {
            font-size: clamp(1.5em, 3vw, 2.5em);
            color: #ffcc00;
            font-weight: bold;
        }

        #turn-timer {
            font-size: clamp(1.8em, 3.5vw, 2.8em);
            color: #ff4444;
            font-weight: bold;
        }

        #turn-indicator {
            font-size: clamp(1em, 2vw, 1.4em);
            color: #44ff44;
            font-weight: bold;
        }

        #night-mode-indicator {
            font-size: clamp(0.9em, 1.8vw, 1.2em);
            color: #4444ff;
            font-weight: bold;
        }

        /* Mano del BOT (arriba) */
        #bot-hand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 1.5vw, 20px);
            padding: clamp(8px, 1.5vh, 15px);
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 2px solid #ff0000;
            opacity: 0.9;
            overflow: visible;
        }

        /* Zona de combate */
        .combat-zone {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(20px, 4vh, 50px);
            padding: clamp(10px, 2vh, 25px) 0;
        }

        .battle-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(20px, 3vw, 40px);
            width: 100%;
            height: 100%;
            max-height: 35vh;
        }

        .opponent-row {
            border-bottom: 3px dashed rgba(255, 255, 255, 0.4);
            padding-bottom: clamp(10px, 2vh, 20px);
        }

        .player-row {
            padding-top: clamp(10px, 2vh, 20px);
        }

        /* Slots de combate - MÁS GRANDES */
        .combat-slot {
            width: clamp(140px, 18vw, 220px);
            height: clamp(180px, 25vh, 280px);
            border: 4px dashed rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: visible;
            transition: all 0.3s;
        }

        .combat-slot.occupied {
            border-style: solid;
            border-color: #ffcc00;
            background: rgba(255, 204, 0, 0.1);
        }

        .combat-slot.healable {
            border-color: #00ff00;
            box-shadow: 0 0 20px #00ff00;
            cursor: pointer;
        }

        /* Cartas - MÁS GRANDES Y RESPONSIVAS */
        .card {
            width: clamp(120px, 16vw, 200px);
            height: clamp(170px, 23vh, 260px);
            background: linear-gradient(135deg, #5d0f19 0%, #3a0a10 100%);
            border: 3px solid #f5e6b9;
            border-radius: 12px;
            padding: clamp(6px, 1vh, 12px);
            cursor: grab;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .card:hover {
            transform: scale(1.15) translateY(-20px);
            z-index: 100;
            box-shadow: 0 15px 40px rgba(255, 204, 0, 0.6);
        }

        .card .card-description {
            display: none;
            font-size: clamp(0.7em, 1.2vw, 0.9em);
            text-align: center;
            margin: clamp(5px, 1vh, 10px) 0;
            color: #ddd;
            flex-grow: 1;
            line-height: 1.3;
        }

        .card:hover .card-description {
            display: block;
        }

        .card-header {
            font-size: clamp(0.8em, 1.5vw, 1.1em);
            font-weight: bold;
            text-align: center;
            margin-bottom: clamp(3px, 0.5vh, 6px);
            color: #ffcc00;
            flex-shrink: 0;
        }

        .card-image {
            width: 100%;
            height: clamp(50px, 8vh, 80px);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: clamp(4px, 0.8vh, 8px);
            font-size: clamp(0.7em, 1.3vw, 1em);
            flex-shrink: 0;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }

        .card-stats {
            display: flex;
            justify-content: space-around;
            font-size: clamp(0.85em, 1.5vw, 1.1em);
            margin-top: auto;
            background: rgba(0, 0, 0, 0.7);
            padding: clamp(5px, 1vh, 10px);
            border-radius: 8px;
            flex-shrink: 0;
            gap: clamp(3px, 0.5vw, 8px);
        }

        .stat {
            background: rgba(0, 0, 0, 0.8);
            padding: clamp(4px, 0.8vh, 8px) clamp(6px, 1vw, 12px);
            border-radius: 6px;
            font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            flex: 1;
            text-align: center;
        }

        .stat-atk { color: #ff6666; border: 2px solid #ff6666; }
        .stat-vida { color: #66ff66; border: 2px solid #66ff66; }
        .stat-vel { color: #6699ff; border: 2px solid #6699ff; }
        .stat-cur { color: #ffcc00; border: 2px solid #ffcc00; }

        /* Mano del jugador - MÁS GRANDE */
        .hand-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2vw, 25px);
            padding: clamp(10px, 2vh, 20px);
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 2px solid #ffcc00;
            overflow: visible;
            min-height: clamp(180px, 28vh, 300px);
        }

        /* Botones */
        .controls {
            position: fixed;
            bottom: clamp(10px, 2vh, 25px);
            left: clamp(10px, 2vw, 25px);
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.5vh, 15px);
            z-index: 1000;
        }

        button {
            padding: clamp(8px, 1.5vh, 14px) clamp(15px, 2vw, 25px);
            font-size: clamp(0.9em, 1.8vw, 1.2em);
            background: #e6675e;
            color: white;
            border: 3px solid #ffcc00;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
        }

        button:hover {
            background: #c44f45;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.6);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
        }

        /* Carta del oponente */
        .card.healing-selected {
            border-color: #00ff00;
            box-shadow: 0 0 25px #00ff00;
        }

        .card.bot-card {
            width: clamp(100px, 14vw, 170px);
            height: clamp(140px, 19vh, 220px);
            background: linear-gradient(135deg, #1a0a0a 0%, #0a0505 100%);
            border-color: #ff0000;
        }

        .card.bot-card .card-header {
            font-size: clamp(0.7em, 1.3vw, 0.95em);
        }

        .card.bot-card .card-stats {
            font-size: clamp(0.7em, 1.3vw, 0.95em);
        }

        .card.bot-card .card-image {
            height: clamp(40px, 6vh, 65px);
        }

        /* Mensajes de log */
        .game-log {
            position: fixed;
            top: clamp(10px, 2vh, 20px);
            right: clamp(10px, 2vw, 20px);
            width: clamp(250px, 22vw, 350px);
            height: clamp(150px, 22vh, 220px);
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ffcc00;
            border-radius: 10px;
            padding: clamp(10px, 1.5vh, 15px);
            overflow-y: auto;
            font-size: clamp(0.75em, 1.4vw, 0.95em);
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        .log-entry {
            margin-bottom: clamp(5px, 1vh, 8px);
            padding: clamp(3px, 0.5vh, 6px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            line-height: 1.4;
        }

        /* Scrollbar personalizada */
        .game-log::-webkit-scrollbar {
            width: 8px;
        }

        .game-log::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .game-log::-webkit-scrollbar-thumb {
            background: #ffcc00;
            border-radius: 4px;
        }

        .game-log::-webkit-scrollbar-thumb:hover {
            background: #ffdd00;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <div class="game-header">
            <div class="player-info">
                <strong>Tribu Nora (Rival)</strong>
            </div>
            <div class="player-info center-info">
                <div id="timer">1:00</div>
                <div id="turn-timer">15</div>
                <div id="turn-indicator">Tu Turno</div>
                <div id="night-mode-indicator" style="display: none;">🌙 MODO NOCHE 🌙</div>
            </div>
            <div class="player-info">
                <strong>Tribu Orah (Tú)</strong>
            </div>
        </div>

        <!-- Mano del BOT (arriba) -->
        <div id="bot-hand">
            <!-- Las cartas del bot se mostrarán aquí -->
        </div>

        <!-- Zona de combate -->
        <div class="combat-zone">
            <!-- Fila del oponente (ARRIBA) -->
            <div class="battle-row opponent-row" id="opponent-field">
                <div class="combat-slot" data-slot="0"></div>
            </div>

            <!-- Fila del jugador (ABAJO) -->
            <div class="battle-row player-row" id="player-field">
                <div class="combat-slot" data-slot="0"></div>
            </div>
        </div>

        <!-- Mano del jugador (abajo) -->
        <div class="hand-zone" id="player-hand">
            <!-- Las cartas se cargarán aquí -->
        </div>

        <!-- Controles fijos abajo a la izquierda -->
        <div class="controls">
            <div class="turn-timer-display" id="turn-timer-display">15</div>
            <button class="ready-button" id="ready-btn" onclick="passTurnManually()" disabled>LISTO ✓</button>
            <button onclick="window.location.href='index.html'">Volver al Menú</button>
        </div>
    </div>

    <!-- Log de eventos -->
    <div class="game-log" id="game-log">
        <strong>--- Log de Juego ---</strong>
    </div>

    <script>
        // ========================================
        // VARIABLES GLOBALES
        // ========================================
        let deck = [];
        let playerHand = [];
        let playerField = [null];
        let opponentField = [null];
        let currentTurn = 1;
        let gameActive = true;
        
        let timeRemaining = 60;
        let timerInterval = null;
        let nightModeActive = false;
        
        let turnTimeRemaining = 15;
        let turnTimerInterval = null;
        let isPlayerTurnActive = false;
        let cardPlayedThisTurn = false;
        let firstCardPlayedEver = false;
        
        let botDeck = [];
        let botHand = [];
        let botDifficulty = 'medium';
        
        let selectedHealingCard = null;
        
        let playerFightersAlive = 3;
        let botFightersAlive = 3;

        // ========================================
        // FUNCIONES DE LOG
        // ========================================
        function addLog(message) {
            const logDiv = document.getElementById('game-log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[Turno ${currentTurn}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        // ========================================
        // SISTEMA DE TIMER Y MODO NOCHE
        // ========================================
        function startTimer() {
            timerInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(timerInterval);
                    return;
                }
                
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining === 45 && !nightModeActive) {
                    activateNightMode();
                }
                
                if (timeRemaining <= 0) {
                    endGame('tiempo');
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            const timerDisplay = document.getElementById('timer');
            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeRemaining <= 15) {
                timerDisplay.style.color = '#ff4444';
            } else if (timeRemaining <= 30) {
                timerDisplay.style.color = '#ffaa00';
            }
        }

        function startTurnTimer() {
            turnTimeRemaining = 15;
            cardPlayedThisTurn = false;
            
            if (!firstCardPlayedEver) {
                document.getElementById('ready-btn').disabled = true;
            } else {
                document.getElementById('ready-btn').disabled = false;
            }
            
            updateTurnTimerDisplay();
            
            if (turnTimerInterval) {
                clearInterval(turnTimerInterval);
            }
            
            turnTimerInterval = setInterval(() => {
                if (!gameActive) {
                    clearInterval(turnTimerInterval);
                    return;
                }
                
                turnTimeRemaining--;
                updateTurnTimerDisplay();
                
                if (turnTimeRemaining <= 0) {
                    clearInterval(turnTimerInterval);
                    
                    if (isPlayerTurnActive && !cardPlayedThisTurn && !firstCardPlayedEver) {
                        autoPlayCard();
                    }
                    
                    endPlayerTurn();
                }
            }, 1000);
        }

        function updateTurnTimerDisplay() {
            const timerDisplay = document.getElementById('turn-timer-display');
            const turnTimer = document.getElementById('turn-timer');
            
            if (!timerDisplay) return;
            
            timerDisplay.textContent = turnTimeRemaining;
            
            if (turnTimeRemaining <= 5) {
                timerDisplay.style.color = '#ff0000';
                timerDisplay.classList.add('warning');
            } else if (turnTimeRemaining <= 10) {
                timerDisplay.style.color = '#ff8800';
                timerDisplay.classList.remove('warning');
            } else {
                timerDisplay.style.color = '#44ff44';
                timerDisplay.classList.remove('warning');
            }
            
            if (turnTimer) turnTimer.textContent = turnTimeRemaining;
        }

        function autoPlayCard() {
            const availableCards = playerHand.filter(c => c.tipo === 'Luchador');
            const emptySlot = playerField.findIndex(slot => slot === null);
            
            if (availableCards.length > 0 && emptySlot !== -1) {
                const randomCard = availableCards[Math.floor(Math.random() * availableCards.length)];
                playerField[emptySlot] = randomCard;
                
                const cardIndex = playerHand.findIndex(c => c.id === randomCard.id);
                playerHand.splice(cardIndex, 1);
                
                addLog(`⏰ Tiempo agotado - Sistema jugó: ${randomCard.nombre}`);
                renderHand();
                renderField();
                
                firstCardPlayedEver = true;
            } else {
                addLog('⏰ Tiempo agotado - Sin cartas para jugar');
            }
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turn-indicator');
            if (isPlayerTurnActive) {
                indicator.textContent = '▼ Tu Turno';
                indicator.style.color = '#44ff44';
            } else {
                indicator.textContent = '▲ Turno del Rival';
                indicator.style.color = '#ff4444';
            }
        }

        function endPlayerTurn() {
            processCombat();
            checkVictoryConditions();
            switchTurn();
        }

        function switchTurn() {
            isPlayerTurnActive = !isPlayerTurnActive;
            updateTurnIndicator();
            
            if (isPlayerTurnActive) {
                addLog('═══ Tu turno - 15 segundos ═══');
                startTurnTimer();
            } else {
                addLog('═══ Turno del rival ═══');
                
                setTimeout(() => {
                    if (!isPlayerTurnActive && gameActive) {
                        opponentTurn();
                        
                        setTimeout(() => {
                            processCombat();
                            checkVictoryConditions();
                            switchTurn();
                        }, 1000);
                    }
                }, 500);
            }
        }

        function activateNightMode() {
            nightModeActive = true;
            addLog('🌙 ¡MODO NOCHE ACTIVADO! Todos los luchadores pierden 1 de vida');
            
            document.getElementById('night-mode-indicator').style.display = 'block';
            document.body.style.background = 'linear-gradient(to bottom, #1a0f2e 0%, #0a0514 100%)';
            
            applyNightModeDamage();
        }

        function applyNightModeDamage() {
            addLog('🌙 === EFECTO DEL MODO NOCHE ===');
            
            playerField.forEach((card, index) => {
                if (card && card.tipo === 'Luchador') {
                    card.vida -= 1;
                    addLog(`${card.nombre}: -1 Vida (Ahora: ${card.vida})`);
                    
                    if (card.vida <= 0) {
                        addLog(`💀 ${card.nombre} ha muerto por la noche`);
                        playerField[index] = null;
                        playerFightersAlive--;
                    }
                }
            });
            
            opponentField.forEach((card, index) => {
                if (card && card.tipo === 'Luchador') {
                    card.vida -= 1;
                    addLog(`${card.nombre} (rival): -1 Vida (Ahora: ${card.vida})`);
                    
                    if (card.vida <= 0) {
                        addLog(`💀 ${card.nombre} (rival) ha muerto por la noche`);
                        opponentField[index] = null;
                        botFightersAlive--;
                    }
                }
            });
            
            addLog('Las curaciones ahora curan 50% menos');
            renderField();
        }

        // ========================================
        // CARGA DE CARTAS
        // ========================================
        async function loadCards() {
            try {
                botDifficulty = localStorage.getItem('botDifficulty') || 'medium';
                
                const savedCards = sessionStorage.getItem('selectedCards');
                
                if (savedCards) {
                    deck = JSON.parse(savedCards);
                    addLog('Cartas cargadas desde tu selección');
                } else {
                    const response = await fetch('data/cartas.json');
                    const data = await response.json();
                    
                    const orahCards = data.mazo_tribu_orah;
                    const shuffled = orahCards.sort(() => 0.5 - Math.random());
                    
                    const luchadores = shuffled.filter(c => c.tipo === 'Luchador').slice(0, 3);
                    const curaciones = shuffled.filter(c => c.tipo === 'Curación').slice(0, 2);
                    
                    deck = [...luchadores, ...curaciones];
                    addLog('Cartas aleatorias cargadas');
                }
                
                await loadBotDeck();
                
                console.log('Deck del jugador:', deck);
                console.log('Deck del bot:', botDeck);
                
                addLog(`Juego iniciado - Dificultad del bot: ${botDifficulty.toUpperCase()}`);
                drawInitialHand();
            } catch (error) {
                addLog('ERROR: No se pudo cargar cartas.json');
                console.error(error);
            }
        }

        async function loadBotDeck() {
            try {
                const response = await fetch('data/cartas.json');
                const data = await response.json();
                
                const noraCards = data.mazo_tribu_nora;
                const shuffled = noraCards.sort(() => 0.5 - Math.random());
                
                const luchadores = shuffled.filter(c => c.tipo === 'Luchador').slice(0, 3);
                const curaciones = shuffled.filter(c => c.tipo === 'Curación').slice(0, 2);
                
                botDeck = [...luchadores, ...curaciones];
                botHand = [...botDeck];
                
                addLog(`Bot cargado: 3 luchadores + 2 curaciones`);
                renderBotHand();
            } catch (error) {
                console.error('Error cargando mazo del bot:', error);
            }
        }

        function renderBotHand() {
            const botHandDiv = document.getElementById('bot-hand');
            botHandDiv.innerHTML = '';
            
            botHand.forEach((card) => {
                const cardElement = createBotCardElement(card);
                botHandDiv.appendChild(cardElement);
            });
        }

        function createBotCardElement(card) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card bot-card';
            
            let statsHTML = '';
            if (card.tipo === 'Luchador') {
                statsHTML = `
                    <div class="card-stats">
                        <span class="stat stat-atk">⚔${card.ataque}</span>
                        <span class="stat stat-vida">❤${card.vida}</span>
                        <span class="stat stat-vel">⚡${card.velocidad}</span>
                    </div>
                `;
            } else {
                statsHTML = `
                    <div class="card-stats">
                        <span class="stat stat-cur">✚${card.curacion}</span>
                    </div>
                `;
            }
            
            cardDiv.innerHTML = `
                <div class="card-header">${card.nombre}</div>
                <div class="card-image">${card.tipo}</div>
                ${statsHTML}
            `;
            
            return cardDiv;
        }

        function drawInitialHand() {
            deck.forEach(card => {
                playerHand.push(card);
            });
            
            console.log('Mano inicial cargada:', playerHand);
            renderHand();
        }

        // ========================================
        // RENDERIZADO DE CARTAS
        // ========================================
        function renderHand() {
            const handDiv = document.getElementById('player-hand');
            
            if (!handDiv) {
                console.error('No se encontró el elemento player-hand');
                return;
            }
            
            handDiv.innerHTML = '';
            
            console.log('Renderizando mano:', playerHand);
            
            if (playerHand.length === 0) {
                handDiv.innerHTML = '<div style="color: white;">Sin cartas en la mano</div>';
                return;
            }
            
            playerHand.forEach((card, index) => {
                const cardElement = createCardElement(card, index);
                
                if (card.tipo === 'Curación') {
                    cardElement.onclick = () => selectHealingCard(card, index);
                    cardElement.style.cursor = 'pointer';
                }
                
                handDiv.appendChild(cardElement);
            });
        }

        function selectHealingCard(card, handIndex) {
            if (selectedHealingCard === handIndex) {
                selectedHealingCard = null;
                renderHand();
                clearHealableSlots();
                addLog('Curación cancelada');
            } else {
                selectedHealingCard = handIndex;
                renderHand();
                highlightHealableSlots();
                addLog(`Seleccionaste: ${card.nombre} - Clic en un luchador para curarlo`);
            }
        }

        function highlightHealableSlots() {
            const playerSlots = document.querySelectorAll('#player-field .combat-slot');
            playerSlots.forEach((slot, index) => {
                if (playerField[index] && playerField[index].tipo === 'Luchador') {
                    slot.classList.add('healable');
                    slot.onclick = () => applyHealing(index);
                }
            });
        }

        function clearHealableSlots() {
            const playerSlots = document.querySelectorAll('#player-field .combat-slot');
            playerSlots.forEach(slot => {
                slot.classList.remove('healable');
                slot.onclick = null;
            });
        }

        function applyHealing(slotIndex) {
            if (!isPlayerTurnActive) {
                addLog('⚠️ No es tu turno');
                return;
            }
            
            if (cardPlayedThisTurn) {
                addLog('⚠️ Solo puedes jugar 1 carta por turno');
                return;
            }
            
            if (selectedHealingCard === null) return;
            
            const healCard = playerHand[selectedHealingCard];
            const targetCard = playerField[slotIndex];
            
            if (!targetCard) return;
            
            const healAmount = nightModeActive ? Math.floor(healCard.curacion / 2) : healCard.curacion;
            targetCard.vida += healAmount;
            
            addLog(`✓ ${targetCard.nombre} curado +${healAmount} vida (Total: ${targetCard.vida})`);
            
            playerHand.splice(selectedHealingCard, 1);
            selectedHealingCard = null;
            
            renderHand();
            renderField();
            clearHealableSlots();
            
            cardPlayedThisTurn = true;
            firstCardPlayedEver = true;
            
            document.getElementById('ready-btn').disabled = false;
            addLog('Presiona LISTO para pasar turno o espera 15 seg');
        }

        function createCardElement(card, handIndex = -1) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            
            if (handIndex === selectedHealingCard) {
                cardDiv.classList.add('healing-selected');
            }
            
            cardDiv.draggable = true;
            
            if (handIndex >= 0) {
                cardDiv.dataset.handIndex = handIndex;
                cardDiv.ondragstart = dragStart;
            }
            
            let statsHTML = '';
            if (card.tipo === 'Luchador') {
                statsHTML = `
                    <div class="card-stats">
                        <span class="stat stat-atk">⚔ ${card.ataque}</span>
                        <span class="stat stat-vida">❤ ${card.vida}</span>
                        <span class="stat stat-vel">⚡ ${card.velocidad}</span>
                    </div>
                `;
            } else {
                statsHTML = `
                    <div class="card-stats">
                        <span class="stat stat-cur">✚ ${card.curacion}</span>
                    </div>
                `;
            }
            
            cardDiv.innerHTML = `
                <div class="card-header">${card.nombre}</div>
                <div class="card-image">${card.tipo}</div>
                <div class="card-description">${card.descripcion || 'Sin descripción'}</div>
                ${statsHTML}
            `;
            
            return cardDiv;
        }

        // ========================================
        // DRAG AND DROP
        // ========================================
        let draggedCardIndex = null;

        function dragStart(e) {
            draggedCardIndex = parseInt(e.target.dataset.handIndex);
            e.dataTransfer.effectAllowed = 'move';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const playerSlots = document.querySelectorAll('#player-field .combat-slot');
            playerSlots.forEach(slot => {
                slot.ondragover = dragOver;
                slot.ondrop = drop;
            });
        });

        function dragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function drop(e) {
            e.preventDefault();
            
            if (!isPlayerTurnActive) {
                addLog('⚠️ No es tu turno');
                return;
            }
            
            if (cardPlayedThisTurn) {
                addLog('⚠️ Solo puedes jugar 1 carta por turno');
                return;
            }
            
            if (draggedCardIndex === null) return;
            
            const slotIndex = parseInt(e.currentTarget.dataset.slot);
            const card = playerHand[draggedCardIndex];
            
            if (playerField[slotIndex] !== null) {
                addLog('Ese slot ya está ocupado');
                return;
            }
            
            if (card.tipo === 'Luchador') {
                playerField[slotIndex] = card;
                playerHand.splice(draggedCardIndex, 1);
                
                addLog(`✓ Jugaste: ${card.nombre}`);
                renderHand();
                renderField();
                
                cardPlayedThisTurn = true;
                firstCardPlayedEver = true;
                
                document.getElementById('ready-btn').disabled = false;
                addLog('Presiona LISTO para pasar turno o espera 15 seg');
            } else {
                addLog('Las curaciones no se juegan en el campo');
            }
            
            draggedCardIndex = null;
        }
        
        function passTurnManually() {
            if (!cardPlayedThisTurn && !shouldForcePass()) {
                addLog('⚠️ Debes jugar una carta antes de pasar turno');
                return;
            }

            addLog('✓ Pasaste turno');
            document.getElementById('ready-btn').disabled = true;

            clearInterval(turnTimerInterval);
            setTimeout(() => {
                endPlayerTurn();
            }, 500);
        }

        function renderField() {
            const playerSlots = document.querySelectorAll('#player-field .combat-slot');
            playerSlots.forEach((slot, index) => {
                slot.innerHTML = '';
                if (playerField[index]) {
                    const card = createCardElement(playerField[index]);
                    card.draggable = false;
                    slot.appendChild(card);
                    slot.classList.add('occupied');
                } else {
                    slot.classList.remove('occupied');
                }
            });
            
            const opponentSlots = document.querySelectorAll('#opponent-field .combat-slot');
            opponentSlots.forEach((slot, index) => {
                slot.innerHTML = '';
                if (opponentField[index]) {
                    const card = createCardElement(opponentField[index]);
                    card.classList.add('opponent');
                    card.draggable = false;
                    slot.appendChild(card);
                    slot.classList.add('occupied');
                } else {
                    slot.classList.remove('occupied');
                }
            });
        }

        // ========================================
        // FIN DEL JUEGO
        // ========================================
        function endGame(reason) {
            gameActive = false;
            clearInterval(timerInterval);
            clearInterval(turnTimerInterval);
            
            let message = '';
            if (reason === 'tiempo') {
                const playerAlive = playerField.filter(c => c !== null).length;
                const opponentAlive = opponentField.filter(c => c !== null).length;
                
                if (playerAlive > opponentAlive) {
                    message = `⏰ ¡VICTORIA POR TIEMPO! Tienes más luchadores (${playerAlive} vs ${opponentAlive})`;
                } else if (opponentAlive > playerAlive) {
                    message = `⏰ DERROTA POR TIEMPO. El rival tiene más luchadores (${opponentAlive} vs ${playerAlive})`;
                } else {
                    const playerTotalLife = playerField.reduce((sum, c) => sum + (c ? c.vida : 0), 0);
                    const opponentTotalLife = opponentField.reduce((sum, c) => sum + (c ? c.vida : 0), 0);
                    
                    if (playerTotalLife > opponentTotalLife) {
                        message = `⏰ ¡VICTORIA POR TIEMPO! Mayor vida total (${playerTotalLife} vs ${opponentTotalLife})`;
                    } else if (opponentTotalLife > playerTotalLife) {
                        message = `⏰ DERROTA POR TIEMPO. Rival con mayor vida total (${opponentTotalLife} vs ${playerTotalLife})`;
                    } else {
                        message = `⏰ EMPATE. Mismo número de luchadores y vida total`;
                    }
                }
            } else if (reason === 'victoria') {
                message = '🎉 ¡VICTORIA DIRECTA! Derrotaste a todos los luchadores enemigos';
            } else if (reason === 'sin_cartas') {
                message = '💀 DERROTA DIRECTA. El rival derrotó a todos tus luchadores';
            }
            
            addLog(message);
            alert(message + '\n\nGracias por jugar Las Luchas de las Tribus');
        }

        // ========================================
        // LÓGICA DE TURNOS
        // ========================================
        function checkVictoryConditions() {
            if (!gameActive) return;
            
            const playerFightersInHand = playerHand.filter(c => c.tipo === 'Luchador').length;
            const playerFightersInField = playerField.filter(c => c !== null && c.tipo === 'Luchador').length;
            const totalPlayerFighters = playerFightersInHand + playerFightersInField;
            
            const botFightersInHand = botHand.filter(c => c.tipo === 'Luchador').length;
            const botFightersInField = opponentField.filter(c => c !== null && c.tipo === 'Luchador').length;
            const totalBotFighters = botFightersInHand + botFightersInField;
            
            if (totalPlayerFighters === 0) {
                endGame('sin_cartas');
            } else if (totalBotFighters === 0) {
                endGame('victoria');
            }
        }

        function processCombat() {
            addLog('=== FASE DE COMBATE ===');
            
            const playerCard = playerField[0];
            const opponentCard = opponentField[0];
            
            if (playerCard && opponentCard) {
                resolveCombat(playerCard, opponentCard, 0);
            }
        }

        function shouldForcePass() {
            const mySlot = playerField[0];
            const enemySlot = opponentField[0];

            if (mySlot && !enemySlot) {
                return true;
            }
            return false;
        }

        function resolveCombat(card1, card2, slotIndex) {
            addLog(`⚔️ Combate en slot ${slotIndex + 1}:`);
            
            let first, second, firstIsPlayer;
            
            if (card1.velocidad > card2.velocidad) {
                first = card1;
                second = card2;
                firstIsPlayer = true;
                addLog(`${first.nombre} (VEL:${first.velocidad}) ataca primero`);
            } else if (card2.velocidad > card1.velocidad) {
                first = card2;
                second = card1;
                firstIsPlayer = false;
                addLog(`${first.nombre} (VEL:${first.velocidad}) ataca primero`);
            } else {
                if (Math.random() > 0.5) {
                    first = card1;
                    second = card2;
                    firstIsPlayer = true;
                } else {
                    first = card2;
                    second = card1;
                    firstIsPlayer = false;
                }
                addLog(`Misma velocidad - Orden aleatorio`);
            }
            
            second.vida -= first.ataque;
            addLog(`${first.nombre} ataca → ${second.nombre} pierde ${first.ataque} vida (Vida restante: ${second.vida})`);
            
            if (second.vida > 0) {
                first.vida -= second.ataque;
                addLog(`${second.nombre} contraataca → ${first.nombre} pierde ${second.ataque} vida (Vida restante: ${first.vida})`);
            } else {
                addLog(`💀 ${second.nombre} ha sido derrotado`);
            }
            
            if (first.vida <= 0) {
                addLog(`💀 ${first.nombre} ha sido derrotado`);
            }
            
            if (card1.vida <= 0) {
                playerField[slotIndex] = null;
            }
            if (card2.vida <= 0) {
                opponentField[slotIndex] = null;
            }
            
            renderField();
        }

        function opponentTurn() {
            addLog('--- Turno del oponente ---');
            
            if (!gameActive || botHand.length === 0) {
                addLog('Bot sin cartas disponibles');
                return;
            }
            
            let botPlayedCard = false;
            
            const healingCards = botHand.filter(c => c.tipo === 'Curación');
            const injuredSlots = opponentField
                .map((card, index) => ({ card, index }))
                .filter(slot => slot.card && slot.card.tipo === 'Luchador' && slot.card.vida < 8);
            
            if (healingCards.length > 0 && injuredSlots.length > 0 && !botPlayedCard) {
                const useHealing = botDifficulty === 'hard' ? Math.random() < 0.7 : Math.random() < 0.5;
                
                if (useHealing) {
                    const healCard = healingCards[0];
                    const targetSlot = injuredSlots[0];
                    
                    const healAmount = nightModeActive ? Math.floor(healCard.curacion / 2) : healCard.curacion;
                    targetSlot.card.vida += healAmount;
                    
                    addLog(`Bot usó ${healCard.nombre} en ${targetSlot.card.nombre} (+${healAmount} vida)`);
                    
                    const cardIndex = botHand.findIndex(c => c.id === healCard.id);
                    if (cardIndex !== -1) {
                        botHand.splice(cardIndex, 1);
                    }
                    
                    botPlayedCard = true;
                    renderField();
                    renderBotHand();
                }
            }
            
            if (!botPlayedCard) {
                const emptySlot = opponentField.findIndex(slot => slot === null);
                
                if (emptySlot !== -1) {
                    const fighters = botHand.filter(c => c.tipo === 'Luchador');
                    
                    if (fighters.length === 0) {
                        addLog('Bot sin luchadores disponibles');
                        return;
                    }
                    
                    const cardToPlay = selectBotCard(emptySlot, fighters);
                    
                    if (cardToPlay) {
                        const botCard = {
                            ...cardToPlay,
                            id: 'bot_' + Date.now() + '_' + Math.random()
                        };
                        
                        opponentField[emptySlot] = botCard;
                        addLog(`Oponente jugó: ${botCard.nombre} (ATK:${botCard.ataque} VID:${botCard.vida} VEL:${botCard.velocidad})`);
                        
                        const cardIndex = botHand.findIndex(c => c.id === cardToPlay.id);
                        if (cardIndex !== -1) {
                            botHand.splice(cardIndex, 1);
                        }
                        
                        renderField();
                        renderBotHand();
                    }
                } else {
                    addLog('Campo del oponente lleno');
                }
            }
        }

        function selectBotCard(targetSlot, availableCards) {
            if (availableCards.length === 0) return null;
            
            const playerCardInSlot = playerField[targetSlot];
            
            switch(botDifficulty) {
                case 'easy':
                    return availableCards[Math.floor(Math.random() * availableCards.length)];
                
                case 'medium':
                    if (playerCardInSlot) {
                        const similarCards = availableCards.filter(c => 
                            Math.abs(c.ataque - playerCardInSlot.ataque) <= 2
                        );
                        if (similarCards.length > 0) {
                            return similarCards[Math.floor(Math.random() * similarCards.length)];
                        }
                    }
                    return availableCards[Math.floor(Math.random() * availableCards.length)];
                
                case 'hard':
                    if (playerCardInSlot) {
                        const fasterCards = availableCards.filter(c => 
                            c.velocidad > playerCardInSlot.velocidad && 
                            c.ataque >= playerCardInSlot.vida
                        );
                        if (fasterCards.length > 0) {
                            return fasterCards.reduce((best, card) => 
                                card.ataque > best.ataque ? card : best
                            );
                        }
                        
                        return availableCards.reduce((best, card) => {
                            const bestScore = best.ataque + best.vida + best.velocidad;
                            const cardScore = card.ataque + card.vida + card.velocidad;
                            return cardScore > bestScore ? card : best;
                        });
                    }
                    return availableCards.reduce((best, card) => 
                        (card.ataque + card.vida) > (best.ataque + best.vida) ? card : best
                    );
                
                default:
                    return availableCards[0];
            }
        }

        // ========================================
        // INICIALIZACIÓN
        // ========================================
        window.onload = () => {
            loadCards();
            startTimer();
            addLog('=== Bienvenido a Las Luchas de las Tribus ===');
            addLog('Sistema de turnos: 15 segundos por jugador');
            addLog('Cada jugador juega 1 carta por turno');
            
            setTimeout(() => {
                isPlayerTurnActive = true;
                updateTurnIndicator();
                startTurnTimer();
                addLog('--- Tu turno - Tienes 15 segundos ---');
            }, 2000);
        };
    </script>
</body>
